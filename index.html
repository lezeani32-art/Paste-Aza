<!DOCTYPE html>
<html>
<head>
  <title>Demo Transfer Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
    }

    .header {
      background: #3f51b5;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .section-title {
      color: #8e24aa;
      font-weight: bold;
      margin-bottom: 10px;
    }

    label {
      font-size: 13px;
      color: #555;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0 15px 0;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: #f9f9f9;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #7b1fa2, #512da8);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="header">
  Generate Transfer 
</div>

<div class="container">

  <form onsubmit="processForm(event)">

    <div class="card">
      <div class="section-title">Sender Details</div>

      <label>Sender Name</label>
      <input type="text" id="sender" required>

      <label>Sender Account Number</label>
      <input type="number" required>

      <label>Choose Bank Receipt to Generate</label>
  <select id="bank"> 
 
 <option value="">-- Choose Bank -</option>
<option value="Access Bank">Access Bank</option <option value="GTBank">GTBank</option>
<option value="First Bank">First Bank</option>
<option value="UBA">UBA</option>
<option value="Zenith Bank">Zenith Bank</option <option value="Fidelity Bank">Fidelity Bank</op'
<option value="Opay">Opay</option>
<option value="Moniepoint">Moniepoint</option>
<option value="Kuda">Kuda Bank</option>
<option value="FCMB">FCMB</option>
    <option value="Union Bank">Union Bank</option>
  </select>
    
    </div> 
    
    <!-- BENEFICIARY -->
<div class="card">
    <div class="section-title">Beneficiary Details</div>

    <label>Beneficiary Name</label>
    <input type="text" id="receiverName">

    <label>Beneficiary Account Number</label>
    <input type="text" id="receiverAccount">

    <label>Same bank as sender?</label>
    <select id="sameBank">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
    </select>
</div>

<!-- OTHER INFO -->
<div class="card">
    <div class="section-title">Other Information</div>

    <label>Amount</label>
    <input type="number" id="amount">
</div>

<button onclick="generateReceipt()">Generate Receipt</button>
    
    <!-- RECEIPT OUTPUT -->
<div class="receipt" id="receipt">

    <div class="receipt-header">
        <div style="font-size:18px;font-weight:700;">NovaPay</div>
        <div style="font-size:13px;margin-top:5px;">Transaction Successful</div>
    </div>

    <div class="receipt-body">

        <div class="amount" id="rAmount"></div>

        <div class="row">
            <span class="label">Reference</span>
            <span class="value" id="rRef"></span>
        </div>

        <div class="row">
            <span class="label">Date</span>
            <span class="value" id="rDate"></span>
        </div>

        <hr>

        <div class="row">
            <span class="label">Sender</span>
            <span class="value" id="rSender"></span>
        </div>

        <div class="row">
            <span class="label">Sender Account</span>
            <span class="value" id="rSenderAcc"></span>
        </div>

        <hr>

        <div class="row">
            <span class="label">Beneficiary</span>
            <span class="value" id="rReceiver"></span>
        </div>

        <div class="row">
            <span class="label">Beneficiary Account</span>
            <span class="value" id="rReceiverAcc"></span>
        </div>

        <div class="row">
            <span class="label">Same Bank</span>
            <span class="value" id="rSameBank"></span>
        </div>

    </div>

</div>

<script>
function generateRef(){
    return "NP-" + Math.floor(Math.random()*1000000000);
}

function generateReceipt(){

    document.getElementById("rAmount").innerText =
        "₦" + Number(document.getElementById("amount").value).toLocaleString();

    document.getElementById("rRef").innerText = generateRef();
    document.getElementById("rDate").innerText = new Date().toLocaleString();

    document.getElementById("rSender").innerText =
        document.getElementById("senderName").value;

    document.getElementById("rSenderAcc").innerText =
        document.getElementById("senderAccount").value;

    document.getElementById("rReceiver").innerText =
        document.getElementById("receiverName").value;

    document.getElementById("rReceiverAcc").innerText =
        document.getElementById("receiverAccount").value;

    document.getElementById("rSameBank").innerText =
        document.getElementById("sameBank").value;

    document.getElementById("receipt").style.display = "block";
