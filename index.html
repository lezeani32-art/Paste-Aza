<!DOCTYPE html>
<html>
<head>
  <title>Generate Transfer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Generate Transfer</h2>

<h3>Sender Details</h3>
<input type="text" id="sender" placeholder="Sender Name">
<input type="text" id="senderAccount" placeholder="Sender Account Number">

<h3>Beneficiary Details</h3>
<input type="text" id="receiver" placeholder="Beneficiary Name">
<input type="text" id="receiverAccount" placeholder="Beneficiary Account Number">

<h3>Other Information</h3>
<input type="number" id="amount" placeholder="Amount">

<button onclick="saveData()">Generate Transfer</button>

<script src="script.js"></script>
</body>
</html>
