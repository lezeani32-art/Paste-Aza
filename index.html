<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay - Modern Purple</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#ECECF3;
}

/* HEADER */
.top-bar{
    background:#3F7AE0;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:15px;
    font-weight:600;
}

/* CARD */
.card{
    background:#F7F7FA;
    margin:14px;
    padding:16px;
    border-radius:16px;
    box-shadow:0 6px 18px rgba(0,0,0,0.04);
}

.section-title{
    color:#9B5DE5;
    font-size:14px;
    font-weight:700;
    margin-bottom:14px;
}

label{
    font-size:12px;
    color:#6B7280;
    display:block;
    margin-bottom:5px;
}

input, textarea{
    width:100%;
    padding:10px 12px;
    border:none;
    border-radius:10px;
    background:#E6E6EB;
    font-size:13px;
    margin-bottom:14px;
    outline:none;
}

.generate-btn{
    width:90%;
    margin:18px auto 35px auto;
    display:block;
    padding:13px;
    border:none;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    color:white;
    background:linear-gradient(90deg,#9B5DE5,#7B2FF7);
    cursor:pointer;
}

/* RECEIPT */
.receipt {
    max-width: 500px;
    margin: 40px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 4px;
    font-family: Arial, sans-serif;
}

.receipt-header {
    text-align: center;
}

.receipt-header h2 {
    margin: 0;
    font-size: 20px;
    font-weight: bold;
}

.receipt-header small {
    color: #777;
    font-size: 12px;
}

.line {
    border-top: 1px solid rgba(0, 0, 0, 0.06);
    margin: 14px 0;
}

.block {
    padding: 8px 0;
}

.label {
    font-size: 13px;
    color: #555;
}

.value {
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
}

.success {
    color: #1a7f37;
}

.section-box {
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 6px;
    padding: 15px;
    margin: 15px 0;
    background: #ffffff;
}

.section-title {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 10px;
    color: #444;
}

.sub-line {
    border-top: 1px solid rgba(0, 0, 0, 0.04);
    margin: 10px 0;
}
</style>
</head>

<body>

<div class="top-bar">Generate Transfer</div>

<div id="formSection">

<div class="card">
    <div class="section-title">Sender Details</div>
    <label>Sender Name</label>
    <input type="text" id="senderName">

    <label>Sender Account Number</label>
    <input type="text" id="senderAccount">
</div>

<div class="card">
    <div class="section-title">Beneficiary Details</div>
    <label>Beneficiary Name</label>
    <input type="text" id="receiverName">

    <label>Beneficiary Account Number</label>
    <input type="text" id="receiverAccount">

    <label>Beneficiary Bank</label>
    <input type="text" id="receiverBank">
</div>

<div class="card">
    <div class="section-title">Other Information</div>
    <label>Amount</label>
    <input type="number" id="amount">

    <label>Narration</label>
    <textarea rows="2" id="narration"></textarea>
</div>

<button class="generate-btn" onclick="generateReceipt()">Generate Receipt</button>

</div>
<div class="receipt" id="receiptSection" style="display:none;">

    <!-- HEADER -->
    <div class="receipt-header">
        <h2>Transaction Receipt</h2>
        <small id="rGenerated"></small>
    </div>

    <div class="line"></div>

    <!-- BODY -->
    <div class="receipt-body">

        <div class="block">
            <div class="label">Transaction Amount</div>
            <div class="value" id="rAmount"></div>
        </div>

        <div class="line"></div>

        <div class="block">
            <div class="label">Transaction Type</div>
            <div class="value">Inter-Bank Transfer</div>
        </div>

        <div class="line"></div>

        <div class="block">
            <div class="label">Transaction Date</div>
            <div class="value" id="rDate"></div>
        </div>

        <div class="line"></div>

        <div class="block">
            <div class="label">Sender</div>
            <div class="value" id="rSender"></div>
        </div>

        <div class="line"></div>

        <!-- BENEFICIARY BOX -->
        <div class="section-box">

            <div class="section-title">Beneficiary Details</div>

            <div class="block">
                <div class="label">Name</div>
                <div class="value" id="rReceiver"></div>
            </div>

            <div class="sub-line"></div>

            <div class="block">
                <div class="label">Account Number</div>
                <div class="value" id="rReceiverAcc"></div>
            </div>

            <div class="sub-line"></div>

            <div class="block">
                <div class="label">Bank</div>
                <div class="value" id="rReceiverBank"></div>
            </div>

        </div>

        <div class="line"></div>

        <div class="block">
            <div class="label">Remark</div>
            <div class="value" id="rNarration"></div>
        </div>

        <div class="line"></div>

        <div class="block">
            <div class="label">Transaction Reference</div>
            <div class="value" id="rRef"></div>
        </div>

        <div class="line"></div>

        <div class="block">
            <div class="label">Transaction Status</div>
            <div class="value success">Transfer Successful</div>
        </div>

    </div>




    <button onclick="goBack()" class="back-btn">Back</button>


</div>

</div>

<script>
function maskAccount(account){
    if(account.length < 6) return account;
    return account.substring(0,4) + "****" + account.substring(account.length-2);
}

function generateReceipt(){

    let amount = document.getElementById("amount").value;
    let senderName = document.getElementById("senderName").value;
    let senderAccount = document.getElementById("senderAccount").value;
    let receiverName = document.getElementById("receiverName").value;
    let receiverAccount = document.getElementById("receiverAccount").value;
    let receiverBank = document.getElementById("receiverBank").value;
    let narration = document.getElementById("narration").value;

    document.getElementById("rAmount").innerText =
        "₦" + Number(amount).toLocaleString();

    document.getElementById("rDate").innerText =
        new Date().toLocaleString();

    document.getElementById("rRef").innerText =
        "NP" + Math.floor(Math.random()*100000000000);

    document.getElementById("rGenerated").innerText =
        "Generated on " + new Date().toLocaleString();

    document.getElementById("rSender").innerText = senderName;
    document.getElementById("rReceiver").innerText = receiverName;
    document.getElementById("rNarration").innerText = narration;

    document.getElementById("rSenderAcc").innerText =
        maskAccount(senderAccount);

    document.getElementById("rReceiverAcc").innerText =
        receiverAccount;

    document.getElementById("rReceiverBank").innerText =
        receiverBank;

    document.getElementById("formSection").style.display = "none";
    document.getElementById("receiptSection").style.display = "block";
}
</script>

</body>
</html>
