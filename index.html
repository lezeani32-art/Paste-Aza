<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay Transaction Receipt</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f4f8;
    padding:20px;
}

.container{
    max-width:420px;
    margin:auto;
}

input, button{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:14px;
}

button{
    background:#163c7a;
    color:white;
    border:none;
    font-weight:bold;
}

/* RECEIPT DESIGN */

.receipt{
    display:none;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    margin-top:20px;
}

.top-bar{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:40px;
}

.brand{
    font-size:20px;
    font-weight:bold;
    color:#163c7a;
}

.title{
    text-align:center;
    color:#163c7a;
    margin-top:15px;
}

.generated{
    text-align:center;
    font-size:12px;
    color:#888;
    margin-bottom:20px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
}

.label{
    color:#f37021;
    font-weight:600;
    font-size:14px;
}

.value{
    color:#163c7a;
    font-size:14px;
    text-align:right;
}

.multi div{
    margin-bottom:4px;
}

.line{
    height:1px;
    background:#e5e5e5;
    margin:8px 0;
}

.status{
    color:#1a7f37;
    font-weight:bold;
}

.footer{
    font-size:12px;
    margin-top:20px;
    color:#777;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h3>Generate NovaPay Receipt</h3>

<input type="text" id="amount" placeholder="Amount">
<input type="text" id="senderName" placeholder="Sender Name">
<input type="text" id="receiverName" placeholder="Beneficiary Name">
<input type="text" id="receiverAcc" placeholder="Beneficiary Account">
<input type="text" id="receiverBank" placeholder="Beneficiary Bank">
<input type="text" id="remark" placeholder="Remark">

<button onclick="generateReceipt()">Generate Receipt</button>

<div class="receipt" id="receipt">

    <div class="top-bar">
        <img src="logo.png" class="logo">
        <div class="brand">NovaPay</div>
    </div>

    <h2 class="title">Transaction Receipt</h2>
    <div class="generated">
        Generated from NovaPay on <span id="rDate"></span>
    </div>

    <div class="row">
        <div class="label">Transaction Amount</div>
        <div class="value" id="rAmount"></div>
    </div>
    <div class="line"></div>

    <div class="row">
        <div class="label">Transaction Type</div>
        <div class="value">INTER-BANK</div>
    </div>
    <div class="line"></div>

    <div class="row">
        <div class="label">Sender</div>
        <div class="value" id="rSender"></div>
    </div>
    <div class="line"></div>

    <div class="row">
        <div class="label">Beneficiary</div>
        <div class="value multi">
            <div id="rReceiver"></div>
            <div id="rReceiverAcc"></div>
            <div id="rReceiverBank"></div>
        </div>
    </div>
    <div class="line"></div>

    <div class="row">
        <div class="label">Remark</div>
        <div class="value" id="rRemark"></div>
    </div>
    <div class="line"></div>

    <div class="row">
        <div class="label">Transaction Reference</div>
        <div class="value" id="rRef"></div>
    </div>
    <div class="line"></div>

    <div class="row">
        <div class="label">Transaction Status</div>
        <div class="value status">Transfer Successful</div>
    </div>

    <div class="footer">
        This is a system generated receipt and does not require signature.
    </div>

    <button onclick="downloadImage()">Download Image</button>

</div>

</div>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

function generateReceipt(){

    const now = new Date();
    const ref = "NP" + Math.floor(Math.random()*1000000000);

    document.getElementById("rAmount").innerText =
        "₦" + Number(document.getElementById("amount").value || 0).toLocaleString();

    document.getElementById("rDate").innerText = now.toLocaleString();

    document.getElementById("rSender").innerText =
        document.getElementById("senderName").value.toUpperCase();

    document.getElementById("rReceiver").innerText =
        document.getElementById("receiverName").value.toUpperCase();

    document.getElementById("rReceiverAcc").innerText =
        document.getElementById("receiverAcc").value;

    document.getElementById("rReceiverBank").innerText =
        document.getElementById("receiverBank").value;

    document.getElementById("rRemark").innerText =
        document.getElementById("remark").value;

    document.getElementById("rRef").innerText = ref;

    document.getElementById("receipt").style.display = "block";
}

function downloadImage(){

    const receipt = document.getElementById("receipt");

    html2canvas(receipt, { scale:3 }).then(function(canvas){

        const link = document.createElement("a");
        const ref = document.getElementById("rRef").innerText || "Receipt";

        link.download = "NovaPay-" + ref + ".png";
        link.href = canvas.toDataURL("image/png");

        link.click();
    });
}

</script>

</body>
</html>
