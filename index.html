<!DOCTYPE html>
<html>
<head>
  <title>Demo Transfer Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
    }

    .header {
      background: #3f51b5;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .section-title {
      color: #8e24aa;
      font-weight: bold;
      margin-bottom: 10px;
    }

    label {
      font-size: 13px;
      color: #555;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0 15px 0;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: #f9f9f9;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #7b1fa2, #512da8);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="header">
  Generate Transfer (Demo)
</div>

<div class="container">

  <form onsubmit="processForm(event)">

    <div class="card">
      <div class="section-title">Sender Details</div>

      <label>Sender Name</label>
      <input type="text" id="sender" required>

      <label>Sender Account Number</label>
      <input type="number" required>

      <label>Choose Bank Receipt to Generate</label>
      <select id="bank">

<option value="">-- Choose Bank -</option>
<option value="Access Bank">Access Bank</option <option value="GTBank">GTBank</option>
<option value="First Bank">First Bank</option>
<option value="UBA">UBA</option>
<option value="Zenith Bank">Zenith Bank</option <option value="Fidelity Bank">Fidelity Bank</op'
<option value="Opay">Opay</option>
<option value="Moniepoint">Moniepoint</option>
<option value="Kuda">Kuda Bank</option>
<option value="FCMB">FCMB</option>
<option value="Union Bank">Union Bank</option>
    </select>

    </div>
    <div class="card">
      <div class="section-title">Beneficiary Details</div>

      <label>Beneficiary Name</label>
      <input type="text" id="receiver" required>

      <label>Beneficiary Account Number</label>
      <input type="number" required>

      <div class="input-row">
        <label>Same bank as sender?</label>
        <input type="text">
      </div>
    </div>

    <div class="card">
      <div class="section-title">Other Information</div>

      <label>Amount</label>
      <input type="number" id="amount" required>

      <label>Narration</label>
      <input type="text">
    </div>

    <button type="submit">Generate Receipt</button>

  </form>

</div>

<script>
function processForm(e) {
  e.preventDefault();

  localStorage.setItem("sender", document.getElementById("sender").value);
  localStorage.setItem("receiver", document.getElementById("receiver").value);
  localStorage.setItem("amount", document.getElementById("amount").value);

  window.location.href = "receipt.html";
}
</script>

</body>
</html>
