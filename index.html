<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay - Modern Purple</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#ECECF3;
}

/* HEADER */
.top-bar{
    background:#3F7AE0;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:15px;
    font-weight:600;
}

/* CARD */
.card{
    background:#F7F7FA;
    margin:14px;
    padding:16px;
    border-radius:16px;
    box-shadow:0 6px 18px rgba(0,0,0,0.04);
}

.section-title{
    color:#9B5DE5;
    font-size:14px;
    font-weight:700;
    margin-bottom:14px;
}

label{
    font-size:12px;
    color:#6B7280;
    display:block;
    margin-bottom:5px;
}

input, textarea{
    width:100%;
    padding:10px 12px;
    border:none;
    border-radius:10px;
    background:#E6E6EB;
    font-size:13px;
    margin-bottom:14px;
    outline:none;
}

.generate-btn{
    width:90%;
    margin:18px auto 35px auto;
    display:block;
    padding:13px;
    border:none;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    color:white;
    background:linear-gradient(90deg,#9B5DE5,#7B2FF7);
    cursor:pointer;
}

/* RECEIPT */
.receipt{
    display:none;
    margin:20px;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 45px rgba(123,47,247,0.25);
}

.receipt-header{
    background:linear-gradient(135deg,#9B5DE5,#7B2FF7);
    padding:22px;
    color:white;
}

.receipt-header h3{
    margin:0;
    font-size:16px;
}

.status{
    font-size:12px;
    margin-top:6px;
    opacity:0.9;
}

.receipt-body{
    background:white;
    padding:20px;
}

.amount{
    font-size:24px;
    font-weight:700;
    margin-bottom:15px;
    color:#7B2FF7;
}

.row{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:13px;
}

.label{
    color:#6B7280;
}

.value{
    font-weight:600;
    text-align:right;
    max-width:60%;
    word-wrap:break-word;
}

.divider{
    height:1px;
    background:#EEE;
    margin:15px 0;
}

.back-btn{
    width:85%;
    margin:15px auto 30px auto;
    display:block;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#ECECF3;
    font-size:13px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="top-bar">Generate Transfer</div>

<div id="formSection">

<div class="card">
    <div class="section-title">Sender Details</div>
    <label>Sender Name</label>
    <input type="text" id="senderName">

    <label>Sender Account Number</label>
    <input type="text" id="senderAccount">
</div>

<div class="card">
    <div class="section-title">Beneficiary Details</div>
    <label>Beneficiary Name</label>
    <input type="text" id="receiverName">

    <label>Beneficiary Account Number</label>
    <input type="text" id="receiverAccount">

    <label>Beneficiary Bank</label>
    <input type="text" id="receiverBank">
</div>

<div class="card">
    <div class="section-title">Other Information</div>
    <label>Amount</label>
    <input type="number" id="amount">

    <label>Narration</label>
    <textarea rows="2" id="narration"></textarea>
</div>

<button class="generate-btn" onclick="generateReceipt()">Generate Receipt</button>

</div>

<!-- RECEIPT -->
<div class="receipt" id="receiptSection">

    <div class="receipt-header">
        <h3>NovaPay</h3>
        <div class="status">Transaction Successful</div>
    </div>

    <div class="receipt-body">

        <div class="amount" id="rAmount"></div>

        <div class="row">
            <span class="label">Reference</span>
            <span class="value" id="rRef"></span>
        </div>

        <div class="row">
            <span class="label">Date</span>
            <span class="value" id="rDate"></span>
        </div>

        <div class="divider"></div>

        <div class="row">
            <span class="label">Sender</span>
            <span class="value" id="rSender"></span>
        </div>

        <div class="row">
            <span class="label">Sender Account</span>
            <span class="value" id="rSenderAcc"></span>
        </div>

        <div class="divider"></div>

        <div class="row">
            <span class="label">Beneficiary</span>
            <span class="value" id="rReceiver"></span>
        </div>

        <div class="row">
            <span class="label">Beneficiary Account</span>
            <span class="value" id="rReceiverAcc"></span>
        </div>

        <div class="row">
            <span class="label">Bank</span>
            <span class="value" id="rReceiverBank"></span>
        </div>

        <div class="row">
            <span class="label">Narration</span>
            <span class="value" id="rNarration"></span>
        </div>

    </div>

    <button class="back-btn" onclick="goBack()">Back</button>

</div>

<script>
function generateReference(){
    return "NP-" + Math.floor(Math.random()*1000000000);
}

function generateReceipt(){

    let amount = document.getElementById("amount").value;
    let senderName = document.getElementById("senderName").value;
    let senderAccount = document.getElementById("senderAccount").value;
    let receiverName = document.getElementById("receiverName").value;
    let receiverAccount = document.getElementById("receiverAccount").value;
    let receiverBank = document.getElementById("receiverBank").value;
    let narration = document.getElementById("narration").value;

    document.getElementById("rAmount").innerText =
        "₦" + Number(amount || 0).toLocaleString();

    document.getElementById("rRef").innerText = generateReference();
    document.getElementById("rDate").innerText = new Date().toLocaleString();

    document.getElementById("rSender").innerText = senderName || "";
    document.getElementById("rSenderAcc").innerText = senderAccount || "";

    document.getElementById("rReceiver").innerText = receiverName || "";
    document.getElementById("rReceiverAcc").innerText = receiverAccount || "";
    document.getElementById("rReceiverBank").innerText = receiverBank || "";

    document.getElementById("rNarration").innerText = narration || "";

    document.getElementById("formSection").style.display = "none";
    document.getElementById("receiptSection").style.display = "block";
}

function goBack(){
    document.getElementById("receiptSection").style.display = "none";
    document.getElementById("formSection").style.display = "block";
}
</script>

</body>
</html>
