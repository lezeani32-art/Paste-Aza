<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transfer Receipt Generator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    padding: 20px;
}

.container {
    display: flex;
    gap: 20px;
}

.form, .receipt {
    background: white;
    padding: 20px;
    border-radius: 8px;
    width: 50%;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

input {
    width: 100%;
    padding: 8px;
    margin: 5px 0 10px;
}

button {
    padding: 10px;
    width: 100%;
    background: #333;
    color: white;
    border: none;
    cursor: pointer;
}

.header {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin-bottom: 10px;
}

.title {
    background: #333;
    color: white;
    padding: 5px;
    font-weight: bold;
}

.box {
    border: 2px solid orange;
    padding: 10px;
    margin-top: 10px;
}

.row {
    display: flex;
    justify-content: space-between;
    border-bottom: 1px solid #ddd;
    padding: 6px 0;
    font-size: 14px;
}

.footer {
    font-size: 12px;
    margin-top: 10px;
    color: #555;
}
</style>

</head>
<body>

<div class="container">

<!-- FORM -->
<div class="form">
    <h3>Enter Details</h3>

    <input id="sender" placeholder="Sender Name">
    <input id="transferId" placeholder="Transfer ID">
    <input id="amountWithdrawn" placeholder="Amount Withdrawn (USD)">
    <input id="fee" placeholder="Fee (USD)">
    <input id="rate" placeholder="Exchange Rate">
    <input id="amountSent" placeholder="Amount Sent">
    <input id="bank" placeholder="Beneficiary Bank">
    <input id="name" placeholder="Beneficiary Name">
    <input id="account" placeholder="Account Number">

    <button onclick="generate()">Generate</button>
</div>

<!-- RECEIPT -->
<div class="receipt">

    <div class="header">
        <div><strong>Payment Platform</strong></div>
        <div id="date"></div>
    </div>

    <div class="title">Confirmation of Transfer</div>

    <div class="box">
        The following details are in reference to a transfer from 
        <span id="senderText"></span> account to the bank account below.
    </div>

    <div class="box" id="table"></div>

    <div class="footer">
        Funds will reflect within 1–3 working days.
    </div>

</div>

</div>

<script>
function generate() {
    let now = new Date().toLocaleString();

    document.getElementById("date").innerText = now;
    document.getElementById("senderText").innerText = sender.value;

    let html = `
    <div class="row"><span>Transfer ID</span><span>${transferId.value}</span></div>
    <div class="row"><span>Date/Time</span><span>${now}</span></div>
    <div class="row"><span>Amount withdrawn</span><span>${amountWithdrawn.value} USD</span></div>
    <div class="row"><span>Fee</span><span>${fee.value} USD</span></div>
    <div class="row"><span>Exchange rate</span><span>${rate.value}</span></div>
    <div class="row"><span>Amount sent</span><span>${amountSent.value}</span></div>
    <div class="row"><span>Beneficiary bank</span><span>${bank.value}</span></div>
    <div class="row"><span>Beneficiary name</span><span>${name.value}</span></div>
    <div class="row"><span>Account number</span><span>${account.value}</span></div>
    `;

    document.getElementById("table").innerHTML = html;
}
</script>

</body>
</html>
