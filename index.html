<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay - Generate Transfer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#ECECF3;
}

/* TOP BLUE BAR */
.top-bar{
    background:#3F7AE0;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    color:white;
    font-weight:600;
    font-size:18px;
}

/* BACK ICON */
.back{
    position:absolute;
    left:15px;
    font-size:22px;
    cursor:pointer;
}

/* CARD CONTAINER */
.card{
    background:#F7F7FA;
    margin:18px;
    padding:20px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,0.04);
}

/* SECTION TITLE */
.section-title{
    color:#9B5DE5;
    font-size:18px;
    font-weight:700;
    margin-bottom:18px;
}

/* LABEL */
label{
    font-size:14px;
    color:#6B7280;
    display:block;
    margin-bottom:6px;
}

/* INPUT STYLE */
input, select, textarea{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#E6E6EB;
    font-size:15px;
    margin-bottom:18px;
    outline:none;
}

/* BANK SELECT BOX STYLE */
.bank-box{
    background:#EFEAE4;
    padding:15px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-weight:600;
    margin-bottom:18px;
    cursor:pointer;
}

.bank-left{
    display:flex;
    align-items:center;
    gap:12px;
}

/* LOGO CIRCLE */
.logo{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#FF8C00;
}

/* CHECKBOX ROW */
.checkbox-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    font-size:15px;
}

.checkbox-row input{
    width:22px;
    height:22px;
}

/* BUTTON */
.generate-btn{
    width:90%;
    margin:20px auto 40px auto;
    display:block;
    padding:16px;
    border:none;
    border-radius:14px;
    font-size:16px;
    font-weight:600;
    color:white;
    background:linear-gradient(90deg,#9B5DE5,#7B2FF7);
    cursor:pointer;
}

.generate-btn:active{
    transform:scale(0.97);
}

</style>
</head>

<body>

<div class="top-bar">
    <div class="back">←</div>
    Generate Transfer
</div>

<!-- SENDER DETAILS -->
<div class="card">
    <div class="section-title">Sender Details</div>

    <label>Sender Name</label>
    <input type="text">

    <label>Sender Account Number</label>
    <input type="text">

    <label>Choose Bank Receipt to Generate</label>
    
    <div class="bank-box">
        <div class="bank-left">
            <div class="logo"></div>
            <span>Select Bank</span>
        </div>
        <span>›</span>
    </div>
</div>

<!-- BENEFICIARY DETAILS -->
<div class="card">
    <div class="section-title">Beneficiary Details</div>

    <label>Beneficiary Name</label>
    <input type="text">

    <label>Beneficiary Account Number</label>
    <input type="text">

    <div class="checkbox-row">
        <span>Same bank as sender?</span>
        <input type="checkbox">
    </div>

    <input type="text" placeholder="Beneficiary Bank">
</div>

<!-- OTHER INFO -->
<div class="card">
    <div class="section-title">Other Information</div>

    <label>Amount</label>
    <input type="number">

    <label>Narration</label>
    <textarea rows="3"></textarea>
</div>

<button class="generate-btn">Generate Receipt</button>

</body>
</html>
