<!DOCTYPE html>
<html>
<head>
  <title>Demo Transfer Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
    }

    .header {
      background: #3f51b5;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .container {
      padding: 15px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .section-title {
      color: #8e24aa;
      font-weight: bold;
      margin-bottom: 10px;
    }

    label {
      font-size: 13px;
      color: #555;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0 15px 0;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: #f9f9f9;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #7b1fa2, #512da8);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="header">
  Generate Transfer 
</div>

<div class="container">

  <form onsubmit="processForm(event)">

    <div class="card">
      <div class="section-title">Sender Details</div>

      <label>Sender Name</label>
      <input type="text" id="sender" required>

      <label>Sender Account Number</label>
      <input type="number" required>

      <label>Choose Bank Receipt to Generate</label>
    <div class="bank-select" onclick="openBankModal()">
  <span id="selectedBank">Select Bank</span>
</div>

      <div class="bank-modal" id="bankModal">
  <div class="modal-content">

    <div class="modal-header">
      <span class="close-btn" onclick="closeBankModal()">✕</span>
      <h3>Select Bank</h3>
    </div>

    <input type="text" id="bankSearch" placeholder="Search Bank Name" onkeyup="filterBanks()">

    <div class="bank-list" id="bankList">
<div class="bank-item" onclick="chooseBank('OPay')">
  <img src="images/opay.png" width="30" alt="OPay Logo">
  <span>OPay</span>
</div>

<div class="bank-item" onclick="chooseBank('Access Bank')">
  <img src="images/access.png" width="30" alt="Access Bank Logo">
  <span>Access Bank</span>
</div>

<div class="bank-item" onclick="chooseBank('United Bank For Africa')">
  <img src="images/uba.png" width="30" alt="UBA Logo">
  <span>United Bank For Africa</span>
</div>

<div class="bank-item" onclick="chooseBank('First Bank Of Nigeria')">
  <img src="images/firstbank.png" width="30" alt="First Bank Logo">
  <span>First Bank Of Nigeria</span>
</div>

<div class="bank-item" onclick="chooseBank('Guaranty Trust Bank')">
  <img src="images/gtbank.png" width="30" alt="GTBank Logo">
  <span>Guaranty Trust Bank</span>
</div>

<div class="bank-item" onclick="chooseBank('Zenith Bank')">
  <img src="images/zenith.png" width="30" alt="Zenith Bank Logo">
  <span>Zenith Bank</span>
</div>
      

    </div>
  </div>
</div>
    </div>
    <div class="card">
      <div class="section-title">Beneficiary Details</div>

      <label>Beneficiary Name</label>
      <input type="text" id="receiver" required>

      <label>Beneficiary Account Number</label>
      <input type="number" required>

      <div class="input-row">
        <label>Same bank as sender?</label>
        <input type="text">
      </div>
    </div>

    <div class="card">
      <div class="section-title">Other Information</div>

      <label>Amount</label>
      <input type="number" id="amount" required>

      <label>Narration</label>
      <input type="text">
    </div>

    <button type="submit">Generate Receipt</button>

  </form>

</div>
<script src="script.js"></script>
