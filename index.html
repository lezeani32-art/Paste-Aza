<!DOCTYPE html>
<html>
<head>
    <title>NovaPay Premium Receipt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- jsPDF CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body{
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to bottom right, #eef2f7, #d9e2f3);
            padding: 15px;
            margin: 0;
        }

        .container{
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        h2{
            text-align: center;
            margin-bottom: 20px;
            color: #1b4b9b;
        }

        input{
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        button{
            width: 100%;
            padding: 12px;
            background: #1b4b9b;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .receipt{
            display: none;
            margin-top: 20px;
            padding: 25px;
            border-radius: 15px;
            background: #ffffff;
            position: relative;
        }

        .watermark{
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 40px;
            color: rgba(0,0,0,0.05);
            font-weight: bold;
            pointer-events: none;
        }

        .logo{
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #1b4b9b;
            margin-bottom: 10px;
        }

        .receipt-title{
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .row{
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin: 8px 0;
        }

        .line{
            height: 1px;
            background: rgba(0,0,0,0.07);
            margin: 6px 0;
        }

        .section-box{
            border: 1px solid rgba(0,0,0,0.07);
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            background: #fafcff;
        }

        .footer{
            text-align: center;
            font-size: 12px;
            margin-top: 20px;
            color: #777;
        }

        @media (max-width: 480px){
            .row{
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <h2>NovaPay Transfer</h2>

    <input type="text" id="amount" placeholder="Amount">
    <input type="text" id="senderName" placeholder="Sender Name">
    <input type="text" id="receiverName" placeholder="Beneficiary Name">
    <input type="text" id="receiverAccount" placeholder="Beneficiary Account">
    <input type="text" id="receiverBank" placeholder="Beneficiary Bank">
    <input type="text" id="remark" placeholder="Remark">

    <button onclick="generateReceipt()">Generate Receipt</button>

    <div class="receipt" id="receipt">

        <div class="watermark">DEMO RECEIPT</div>

        <div class="logo">NovaPay</div>

        <div class="receipt-title">Transaction Receipt</div>

        <div class="row">
            <span>Transaction Amount</span>
            <span id="rAmount"></span>
        </div>
        <div class="line"></div>

        <div class="row">
            <span>Transaction Type</span>
            <span>Inter-Bank Transfer</span>
        </div>
        <div class="line"></div>

        <div class="row">
            <span>Transaction Date</span>
            <span id="rDate"></span>
        </div>
        <div class="line"></div>

        <div class="section-box">
            <strong>Sender</strong>
            <div class="row">
                <span>Name</span>
                <span id="rSender"></span>
            </div>
        </div>

        <div class="section-box">
            <strong>Beneficiary</strong>
            <div class="row">
                <span>Name</span>
                <span id="rReceiver"></span>
            </div>
            <div class="row">
                <span>Account</span>
                <span id="rReceiverAcc"></span>
            </div>
            <div class="row">
                <span>Bank</span>
                <span id="rReceiverBank"></span>
            </div>
        </div>

        <div class="row">
            <span>Remark</span>
            <span id="rRemark"></span>
        </div>
        <div class="line"></div>

        <div class="row">
            <span>Transaction Reference</span>
            <span id="rRef"></span>
        </div>
        <div class="line"></div>

        <div class="row">
            <span>Transaction Status</span>
            <span>Successful</span>
        </div>

        <div class="footer">
            Generated from NovaPay
        </div>

        <button onclick="downloadPDF()">Download PDF</button>

    </div>

</div>

<script>
function generateReference(){
    return "NP-" + Math.floor(Math.random()*1000000000);
}

function generateReceipt(){

    document.getElementById("rAmount").innerText =
        "₦" + Number(document.getElementById("amount").value || 0).toLocaleString();

    document.getElementById("rDate").innerText =
        new Date().toLocaleString();

    document.getElementById("rSender").innerText =
        document.getElementById("senderName").value;

    document.getElementById("rReceiver").innerText =
        document.getElementById("receiverName").value;

    document.getElementById("rReceiverAcc").innerText =
        document.getElementById("receiverAccount").value;

    document.getElementById("rReceiverBank").innerText =
        document.getElementById("receiverBank").value;

    document.getElementById("rRemark").innerText =
        document.getElementById("remark").value;

    document.getElementById("rRef").innerText = generateReference();

    document.getElementById("receipt").style.display = "block";
}

async function downloadPDF(){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.text("NovaPay - Transaction Receipt", 20, 20);
    doc.text("Amount: " + document.getElementById("rAmount").innerText, 20, 30);
    doc.text("Date: " + document.getElementById("rDate").innerText, 20, 40);
    doc.text("Sender: " + document.getElementById("rSender").innerText, 20, 50);
    doc.text("Beneficiary: " + document.getElementById("rReceiver").innerText, 20, 60);
    doc.text("Account: " + document.getElementById("rReceiverAcc").innerText, 20, 70);
    doc.text("Bank: " + document.getElementById("rReceiverBank").innerText, 20, 80);
    doc.text("Remark: " + document.getElementById("rRemark").innerText, 20, 90);
    doc.text("Reference: " + document.getElementById("rRef").innerText, 20, 100);
    doc.text("Status: Successful", 20, 110);

    doc.save("NovaPay-Receipt.pdf");
}
</script>

</body>
</html>
