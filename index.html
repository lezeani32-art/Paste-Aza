<!DOCTYPE html>
<html>
<head>
    <title>NovaPay Receipt</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 20px;
        }

        .container{
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        h2{
            text-align: center;
            margin-bottom: 25px;
        }

        input{
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }

        button{
            width: 100%;
            padding: 10px;
            background: #1b4b9b;
            color: white;
            border: none;
            cursor: pointer;
        }

        /* Receipt Styling */

        .receipt{
            display: none;
            margin-top: 20px;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .receipt-title{
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .line{
            height: 1px;
            background: rgba(0,0,0,0.05);
            margin: 10px 0;
        }

        .row{
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .label{
            color: #555;
        }

        .value{
            font-weight: bold;
        }

        .section-box{
            border: 1px solid rgba(0,0,0,0.05);
            padding: 10px;
            border-radius: 6px;
            margin: 10px 0;
        }

        .section-title{
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .footer{
            text-align: center;
            font-size: 12px;
            margin-top: 20px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>NovaPay Transfer</h2>

    <input type="text" id="amount" placeholder="Amount">
    <input type="text" id="senderName" placeholder="Sender Name">
    <input type="text" id="receiverName" placeholder="Beneficiary Name">
    <input type="text" id="receiverAccount" placeholder="Beneficiary Account">
    <input type="text" id="receiverBank" placeholder="Beneficiary Bank">
    <input type="text" id="remark" placeholder="Remark">

    <button onclick="generateReceipt()">Generate Receipt</button>

    <div class="receipt" id="receipt">

        <div class="receipt-title">Transaction Receipt</div>

        <div class="row">
            <span class="label">Transaction Amount</span>
            <span class="value" id="rAmount"></span>
        </div>
        <div class="line"></div>

        <div class="row">
            <span class="label">Transaction Type</span>
            <span class="value">Inter-Bank Transfer</span>
        </div>
        <div class="line"></div>

        <div class="row">
            <span class="label">Transaction Date</span>
            <span class="value" id="rDate"></span>
        </div>
        <div class="line"></div>

        <!-- Sender Box -->
        <div class="section-box">
            <div class="section-title">Sender</div>
            <div class="row">
                <span class="label">Name</span>
                <span class="value" id="rSender"></span>
            </div>
        </div>

        <!-- Beneficiary Box -->
        <div class="section-box">
            <div class="section-title">Beneficiary</div>
            <div class="row">
                <span class="label">Name</span>
                <span class="value" id="rReceiver"></span>
            </div>
            <div class="row">
                <span class="label">Account</span>
                <span class="value" id="rReceiverAcc"></span>
            </div>
            <div class="row">
                <span class="label">Bank</span>
                <span class="value" id="rReceiverBank"></span>
            </div>
        </div>

        <div class="row">
            <span class="label">Remark</span>
            <span class="value" id="rRemark"></span>
        </div>
        <div class="line"></div>

        <div class="row">
            <span class="label">Transaction Reference</span>
            <span class="value" id="rRef"></span>
        </div>
        <div class="line"></div>

        <div class="row">
            <span class="label">Transaction Status</span>
            <span class="value">Successful</span>
        </div>

        <div class="footer">
            Generated from NovaPay
        </div>

    </div>

</div>

<script>
function generateReference(){
    return "NP-" + Math.floor(Math.random()*1000000000);
}

function generateReceipt(){

    let amount = document.getElementById("amount").value;
    let sender = document.getElementById("senderName").value;
    let receiver = document.getElementById("receiverName").value;
    let receiverAcc = document.getElementById("receiverAccount").value;
    let receiverBank = document.getElementById("receiverBank").value;
    let remark = document.getElementById("remark").value;

    document.getElementById("rAmount").innerText =
        "₦" + Number(amount || 0).toLocaleString();

    document.getElementById("rDate").innerText =
        new Date().toLocaleString();

    document.getElementById("rSender").innerText = sender;
    document.getElementById("rReceiver").innerText = receiver;
    document.getElementById("rReceiverAcc").innerText = receiverAcc;
    document.getElementById("rReceiverBank").innerText = receiverBank;
    document.getElementById("rRemark").innerText = remark;
    document.getElementById("rRef").innerText = generateReference();

    document.getElementById("receipt").style.display = "block";
}
</script>

</body>
</html>
