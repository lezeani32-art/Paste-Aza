<!DOCTYPE html>
<html>
<head>
  <title>Demo Payment Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background:#f2f2f2; padding:20px; }
    .box { background:white; padding:20px; max-width:400px; margin:auto; border-radius:10px; }
    input, button { width:100%; padding:10px; margin:10px 0; }
    button { background:#1a237e; color:white; border:none; }
  </style>
</head>
<body>

<div class="box">
  <h2>Banking Transfer</h2>

  <form onsubmit="processForm(event)">
    <input type="text" id="sender" placeholder="Sender Name" required>
    <input type="text" id="receiver" placeholder="Receiver Name" required>
    <input type="number" id="Transaction amount" placeholder="Transation Amount (₦)" required>
   <input type="text" id="Transaction" placeholder="Transaction type" required>
   <input type="text" id="Remark" placeholder="Remark" required>
    <button type="submit">Transfer</button>
  </form>
</div>

<script>
function processForm(e) {
  e.preventDefault();

  localStorage.setItem("sender", document.getElementById("sender").value);
  localStorage.setItem("receiver", document.getElementById("receiver").value);
  localStorage.setItem("Transaction amount", document.getElementById("amount").value);
  localStorage.setItem("Transaction", document.getElementById("Transation").value);
  localStorage.setItem("Remark", document.getElementById("Remark").value);
  window.location.href = "receipt.html";
}
</script>

</body>
</html>
