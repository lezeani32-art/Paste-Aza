<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay Receipt</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#f2f4f7;
}

/* HEADER */
.top-bar{
    background:#3F7AE0;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:15px;
    font-weight:600;
}

/* FORM CARDS */
.card{
    background:#ffffff;
    margin:14px;
    padding:16px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

.section-title{
    font-size:14px;
    font-weight:600;
    margin-bottom:14px;
}

label{
    font-size:12px;
    color:#6B7280;
    display:block;
    margin-bottom:5px;
}

input, textarea{
    width:100%;
    padding:10px;
    border:1px solid #e5e7eb;
    border-radius:8px;
    font-size:13px;
    margin-bottom:14px;
}

.generate-btn{
    width:90%;
    margin:18px auto 35px auto;
    display:block;
    padding:13px;
    border:none;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    color:white;
    background:#5b2dff;
    cursor:pointer;
}

/* RECEIPT */
.receipt {
    max-width: 500px;
    margin: 40px auto;
    background: #ffffff;
    padding: 30px;
    border-radius: 4px;
    display:none;
}

.receipt-header {
    text-align: center;
}

.receipt-header h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
}

.receipt-header small {
    color: #777;
    font-size: 12px;
}

.line {
    border-top: 1px solid rgba(0, 0, 0, 0.05);
    margin: 14px 0;
}

.block {
    padding: 8px 0;
}

.label {
    font-size: 13px;
    color: #555;
}

.value {
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
}

.success {
    color: #1a7f37;
}

/* BOX SECTIONS */
.section-box {
    border: 1px solid rgba(0, 0, 0, 0.05);
    border-radius: 6px;
    padding: 15px;
    margin: 15px 0;
    background: #ffffff;
}

.section-title-box {
    font-weight: 600;
    font-size: 13px;
    margin-bottom: 10px;
    color: #444;
}

.sub-line {
    border-top: 1px solid rgba(0, 0, 0, 0.04);
    margin: 10px 0;
}

.back-btn{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#e5e7eb;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="top-bar">Generate Transfer</div>

<div id="formSection">

<div class="card">
    <div class="section-title">Sender Details</div>
    <label>Sender Name</label>
    <input type="text" id="senderName">
</div>

<div class="card">
    <div class="section-title">Beneficiary Details</div>
    <label>Beneficiary Name</label>
    <input type="text" id="receiverName">

    <label>Beneficiary Account Number</label>
    <input type="text" id="receiverAccount">

    <label>Beneficiary Bank</label>
    <input type="text" id="receiverBank">
</div>

<div class="card">
    <div class="section-title">Other Information</div>
    <label>Amount</label>
    <input type="number" id="amount">

    <label>Narration</label>
    <textarea rows="2" id="narration"></textarea>
</div>

<button class="generate-btn" onclick="generateReceipt()">Generate Receipt</button>

</div>

<!-- RECEIPT SECTION -->
<div class="receipt" id="receiptSection">

    <div class="receipt-header">
        <h2>Transaction Receipt</h2>
        <small id="rGenerated"></small>
    </div>

    <div class="line"></div>

    <div class="block">
        <div class="label">Transaction Amount</div>
        <div class="value" id="rAmount"></div>
    </div>

    <div class="line"></div>

    <div class="block">
        <div class="label">Transaction Type</div>
        <div class="value">Inter-Bank Transfer</div>
    </div>

    <div class="line"></div>

    <div class="block">
        <div class="label">Transaction Date</div>
        <div class="value" id="rDate"></div>
    </div>

    <div class="line"></div>

    <!-- SENDER BOX -->
    <div class="section-box">
        <div class="section-title-box">Sender</div>
        <div class="block">
            <div class="label">Name</div>
            <div class="value" id="rSender"></div>
        </div>
    </div>

    <!-- BENEFICIARY BOX -->
    <div class="section-box">
        <div class="section-title-box">Beneficiary Details</div>

        <div class="block">
            <div class="label">Name</div>
            <div class="value" id="rReceiver"></div>
        </div>

        <div class="sub-line"></div>

        <div class="block">
            <div class="label">Account Number</div>
            <div class="value" id="rReceiverAcc"></div>
        </div>

        <div class="sub-line"></div>

        <div class="block">
            <div class="label">Bank</div>
            <div class="value" id="rReceiverBank"></div>
        </div>
    </div>

    <div class="line"></div>

    <div class="block">
        <div class="label">Remark</div>
        <div class="value" id="rNarration"></div>
    </div>

    <div class="line"></div>

    <div class="block">
        <div class="label">Transaction Reference</div>
        <div class="value" id="rRef"></div>
    </div>

    <div class="line"></div>

    <div class="block">
        <div class="label">Transaction Status</div>
        <div class="value success">Transfer Successful</div>
    </div>

    <button onclick="goBack()" class="back-btn">Back</button>

</div>

<script>
function generateReceipt(){

    let amount = document.getElementById("amount").value;
    let senderName = document.getElementById("senderName").value;
    let receiverName = document.getElementById("receiverName").value;
    let receiverAccount = document.getElementById("receiverAccount").value;
    let receiverBank = document.getElementById("receiverBank").value;
    let narration = document.getElementById("narration").value;

    document.getElementById("rAmount").innerText =
        "₦" + Number(amount || 0).toLocaleString();

    document.getElementById("rDate").innerText =
        new Date().toLocaleString();

    document.getElementById("rRef").innerText =
        "NP" + Math.floor(Math.random()*100000000000);

    document.getElementById("rGenerated").innerText =
        "Generated from NovaPay on " + new Date().toLocaleString();

    document.getElementById("rSender").innerText = senderName;
    document.getElementById("rReceiver").innerText = receiverName;
    document.getElementById("rReceiverAcc").innerText = receiverAccount;
    document.getElementById("rReceiverBank").innerText = receiverBank;
    document.getElementById("rNarration").innerText = narration;

    document.getElementById("formSection").style.display = "none";
    document.getElementById("receiptSection").style.display = "block";
}

function goBack(){
    document.getElementById("receiptSection").style.display = "none";
    document.getElementById("formSection").style.display = "block";
}
</script>

</body>
</html>
