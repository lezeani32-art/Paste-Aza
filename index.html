<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay Receipt</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f5f9;
    padding:20px;
}

.container{
    max-width:400px;
    margin:auto;
}

input, button{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

button{
    background:#0033A1;
    color:white;
    border:none;
}

.receipt{
    display:none;
    margin-top:20px;
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.header{
    text-align:center;
    font-weight:bold;
    font-size:18px;
    margin-bottom:15px;
}

.amount{
    font-size:26px;
    font-weight:bold;
    text-align:center;
    margin:15px 0;
}

.row{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-bottom:10px;
    border-bottom:1px solid #eee;
    padding-bottom:5px;
}

.footer{
    text-align:center;
    font-size:11px;
    margin-top:15px;
    color:#666;
}
</style>
</head>

<body>

<div class="container">

<h3>Generate Receipt</h3>

<input type="text" id="senderName" placeholder="Sender Name">
<input type="text" id="receiverName" placeholder="Beneficiary Name">
<input type="text" id="receiverAcc" placeholder="Beneficiary Account Number">
<input type="text" id="receiverBank" placeholder="Bank Name">
<input type="number" id="amount" placeholder="Amount">
<input type="text" id="remark" placeholder="Remark">

<button onclick="generateReceipt()">Generate Receipt</button>

<div class="receipt" id="receipt">

    <div class="header">NovaPay Transaction Receipt</div>

    <div class="amount" id="rAmount"></div>

    <div class="row">
        <span>Date</span>
        <span id="rDate"></span>
    </div>

    <div class="row">
        <span>Reference</span>
        <span id="rRef"></span>
    </div>

    <div class="row">
        <span>Sender</span>
        <span id="rSender"></span>
    </div>

    <div class="row">
        <span>Beneficiary</span>
        <span id="rReceiver"></span>
    </div>

    <div class="row">
        <span>Account</span>
        <span id="rReceiverAcc"></span>
    </div>

    <div class="row">
        <span>Bank</span>
        <span id="rReceiverBank"></span>
    </div>

    <div class="row">
        <span>Remark</span>
        <span id="rRemark"></span>
    </div>

    <div class="footer">
        This is a system generated receipt.
    </div>

    <button onclick="downloadImage()">Download Image</button>

</div>

</div>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>

function generateReceipt(){

    const now = new Date();
    const ref = "NP" + Math.floor(Math.random()*1000000000);

    document.getElementById("rAmount").innerText =
        "₦" + parseFloat(document.getElementById("amount").value).toLocaleString();

    document.getElementById("rDate").innerText = now.toLocaleString();
    document.getElementById("rRef").innerText = ref;

    document.getElementById("rSender").innerText =
        document.getElementById("senderName").value.toUpperCase();

    document.getElementById("rReceiver").innerText =
        document.getElementById("receiverName").value.toUpperCase();

    document.getElementById("rReceiverAcc").innerText =
        document.getElementById("receiverAcc").value;

    document.getElementById("rReceiverBank").innerText =
        document.getElementById("receiverBank").value;

    document.getElementById("rRemark").innerText =
        document.getElementById("remark").value;

    document.getElementById("receipt").style.display = "block";
}

function downloadImage(){

    const receipt = document.getElementById("receipt");

    html2canvas(receipt, { scale:3 }).then(function(canvas){

        const link = document.createElement("a");

        const ref = document.getElementById("rRef").innerText || "Receipt";

        link.download = "NovaPay-" + ref + ".png";
        link.href = canvas.toDataURL("image/png");

        link.click();
    });
}

</script>

</body>
</html>
