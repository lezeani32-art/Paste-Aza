<!DOCTYPE html>
<html>
<head>
  <title>Paste Aza</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      text-align: center;
      padding: 20px;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      margin: auto;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }
    button {
      background: green;
      color: white;
      border: none;
    }
  </style>
</head>
<body>

<h2>Paste Aza Form</h2>

<form>
  <input type="text" placeholder="Enter Account Name" required>
  <input type="text" placeholder="Enter Account Number" required>
  <input type="text" placeholder="Enter Bank Name" required>
  <button type="submit">Submit</button>
</form>

</body>
</html>
