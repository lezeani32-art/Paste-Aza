<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transfer Receipt Generator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    padding: 20px;
}

.container {
    display: flex;
    gap: 20px;
}

.form, .receipt {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    width: 50%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

input {
    width: 100%;
    padding: 8px;
    margin: 6px 0 10px;
    border: 1px solid #ddd;
}

button {
    padding: 10px;
    width: 100%;
    background: #FF4800;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo img {
    height: 30px;
}

.title {
    background: #333;
    color: white;
    padding: 8px;
    margin-top: 10px;
    font-weight: bold;
}

.box {
    border: 2px solid #FF4800;
    padding: 12px;
    margin-top: 10px;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
}

/* ✅ FOOTER STYLE */
.footer {
    margin-top: 15px;
    font-size: 12px;
    color: #666;
    border-top: 1px solid #ddd;
    padding-top: 10px;
    text-align: center;
}
</style>

</head>
<body>

<div class="container">

<!-- FORM -->
<div class="form">
    <h3>Enter Details</h3>

    <input id="sender" placeholder="Sender Name">
    <input id="amountWithdrawn" placeholder="Amount Withdrawn (USD)">
    <input id="rate" placeholder="Exchange Rate (e.g 1500)">
    <input id="fee" placeholder="Fee (USD)">
    <input id="bank" placeholder="Beneficiary Bank">
    <input id="name" placeholder="Beneficiary Name">
    <input id="account" placeholder="Account Number">

    <button onclick="generate()">Generate Receipt</button>
</div>

<!-- RECEIPT -->
<div class="receipt">

    <div class="header">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Payoneer_logo.svg">
        </div>
        <div id="date"></div>
    </div>

    <div class="title">Confirmation of Transfer</div>

    <div class="box">
        Transfer from <strong id="senderText">N/A</strong> to bank account below.
    </div>

    <div class="box" id="table"></div>

    <!-- ✅ FOOTER ADDED -->
    <div class="footer">
        This is a system-generated receipt and does not require a signature.<br>
        Funds typically arrive within 1–3 business days depending on the receiving bank.
    </div>

</div>

</div>

<script>
function generate() {

    let now = new Date().toLocaleString();
    let transferId = "TRF" + Date.now();

    let senderVal = sender.value || "N/A";
    let amountUSD = parseFloat(amountWithdrawn.value) || 0;
    let rateVal = parseFloat(rate.value) || 0;
    let feeVal = fee.value || "0";

    // ✅ AUTO CALCULATION
    let amountConverted = amountUSD * rateVal;

    let bankVal = bank.value || "N/A";
    let nameVal = name.value || "N/A";
    let accountVal = account.value || "N/A";

    document.getElementById("date").innerText = now;
    document.getElementById("senderText").innerText = senderVal;

    let html = `
    <div class="row"><span>Transfer ID</span><span>${transferId}</span></div>
    <div class="row"><span>Date/Time</span><span>${now}</span></div>
    <div class="row"><span>Amount withdrawn</span><span>${amountUSD} USD</span></div>
    <div class="row"><span>Fee</span><span>${feeVal} USD</span></div>
    <div class="row"><span>Exchange rate</span><span>1 USD = ${rateVal}</span></div>
    <div class="row"><span>Amount sent</span><span>${amountConverted.toLocaleString()}</span></div>
    <div class="row"><span>Beneficiary bank</span><span>${bankVal}</span></div>
    <div class="row"><span>Beneficiary name</span><span>${nameVal}</span></div>
    <div class="row"><span>Account number</span><span>${accountVal}</span></div>
    `;

    document.getElementById("table").innerHTML = html;
}
</script>

</body>
</html>
