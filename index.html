<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaPay - Generate Transfer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background:#ECECF3;
}

/* TOP BLUE BAR */
.top-bar{
    background:#3F7AE0;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    color:white;
    font-weight:600;
    font-size:15px;
}

/* BACK ICON */
.back{
    position:absolute;
    left:12px;
    font-size:18px;
    cursor:pointer;
}

/* CARD */
.card{
    background:#F7F7FA;
    margin:14px;
    padding:16px;
    border-radius:16px;
    box-shadow:0 6px 18px rgba(0,0,0,0.04);
}

/* SECTION TITLE */
.section-title{
    color:#9B5DE5;
    font-size:14px;
    font-weight:700;
    margin-bottom:14px;
}

/* LABEL */
label{
    font-size:12px;
    color:#6B7280;
    display:block;
    margin-bottom:5px;
}

/* INPUTS */
input, textarea{
    width:100%;
    padding:10px 12px;
    border:none;
    border-radius:10px;
    background:#E6E6EB;
    font-size:13px;
    margin-bottom:14px;
    outline:none;
}

/* BANK SELECT BOX */
.bank-box{
    background:#EFEAE4;
    padding:10px 12px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    font-weight:600;
    margin-bottom:14px;
    cursor:pointer;
}

.bank-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:26px;
    height:26px;
    border-radius:50%;
    background:#FF8C00;
}

/* CHECKBOX ROW */
.checkbox-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    font-size:13px;
}

.checkbox-row input{
    width:18px;
    height:18px;
}

/* BUTTON */
.generate-btn{
    width:90%;
    margin:18px auto 35px auto;
    display:block;
    padding:13px;
    border:none;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    color:white;
    background:linear-gradient(90deg,#9B5DE5,#7B2FF7);
    cursor:pointer;
}

.generate-btn:active{
    transform:scale(0.97);
}

</style>
</head>

<body>

<div class="top-bar">
    <div class="back">←</div>
    Generate Transfer
</div>

<!-- SENDER DETAILS -->
<div class="card">
    <div class="section-title">Sender Details</div>

    <label>Sender Name</label>
    <input type="text">

    <label>Sender Account Number</label>
    <input type="text">

    <label>Choose Bank Receipt to Generate</label>
    ‹select id="bank">

<option value="">-- Choose Bank -</option>
<option value="Access Bank">Access Bank</option <option value="GTBank">GTBank</option>
<option value="First Bank">First Bank</option>
<option value="UBA">UBA</option>
<option value="Zenith Bank">Zenith Bank</option <option value="Fidelity Bank">Fidelity Bank</op'
<option value="Opay">Opay</option>
<option value="Moniepoint">Moniepoint</option>
<option value="Kuda">Kuda Bank</option>
<option value="FCMB">FCMB</option>
<option value="Union Bank">Union Bank</option>
</select> 

</div>

<!-- BENEFICIARY DETAILS -->
<div class="card">
    <div class="section-title">Beneficiary Details</div>

    <label>Beneficiary Name</label>
    <input type="text">

    <label>Beneficiary Account Number</label>
    <input type="text">

    <div class="checkbox-row">
        <span>Same bank as sender?</span>
        <input type="checkbox">
    </div>

    <input type="text" placeholder="Beneficiary Bank">
</div>

<!-- OTHER INFO -->
<div class="card">
    <div class="section-title">Other Information</div>

    <label>Amount</label>
    <input type="number">

    <label>Narration</label>
    <textarea rows="2"></textarea>
</div>

<button class="generate-btn">Generate Receipt</button>

</body>
</html>
