<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transfer Receipt Generator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f6f8;
    padding: 20px;
}

.container {
    display: flex;
    gap: 20px;
}

.form, .receipt {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    width: 50%;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

input {
    width: 100%;
    padding: 8px;
    margin: 6px 0 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

button {
    padding: 10px;
    width: 100%;
    background: #FF4800;
    border: none;
    color: white;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
}

button:hover {
    background: #e63e00;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo img {
    height: 30px;
}

.date {
    font-size: 14px;
    color: #555;
}

.title {
    background: #333;
    color: white;
    padding: 8px;
    margin-top: 10px;
    font-weight: bold;
}

.box {
    border: 2px solid #FF4800;
    padding: 12px;
    margin-top: 10px;
    border-radius: 4px;
}

.row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

.row:last-child {
    border-bottom: none;
}

.footer {
    font-size: 12px;
    margin-top: 12px;
    color: #666;
}
</style>

</head>
<body>

<div class="container">

<!-- FORM -->
<div class="form">
    <h3>Enter Details</h3>

    <input id="sender" placeholder="Sender Name">
    <input id="amountWithdrawn" placeholder="Amount Withdrawn (USD)">
    <input id="fee" placeholder="Fee (USD)">
    <input id="rate" placeholder="Exchange Rate">
    <input id="amountSent" placeholder="Amount Sent">
    <input id="bank" placeholder="Beneficiary Bank">
    <input id="name" placeholder="Beneficiary Name">
    <input id="account" placeholder="Account Number">

    <button onclick="generate()">Generate Receipt</button>
</div>

<!-- RECEIPT -->
<div class="receipt">

    <div class="header">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/7b/Payoneer_logo.svg">
        </div>
        <div class="date" id="date"></div>
    </div>

    <div class="title">Confirmation of Transfer</div>

    <div class="box">
        The following details are in reference to a transfer from 
        <strong id="senderText">N/A</strong> account to the bank account below.
    </div>

    <div class="box" id="table"></div>

    <div class="footer">
        Funds will reflect within 1–3 working days.
    </div>

</div>

</div>

<script>
function generate() {

    let now = new Date();
    let formattedDate = now.toLocaleString();

    let transferId = "TRF" + Date.now();

    let senderVal = sender.value || "N/A";
    let amountWithdrawnVal = amountWithdrawn.value || "0";
    let feeVal = fee.value || "0";
    let rateVal = rate.value || "N/A";
    let amountSentVal = amountSent.value || "0";
    let bankVal = bank.value || "N/A";
    let nameVal = name.value || "N/A";
    let accountVal = account.value || "N/A";

    document.getElementById("date").innerText = formattedDate;
    document.getElementById("senderText").innerText = senderVal;

    let html = `
    <div class="row"><span>Transfer ID</span><span>${transferId}</span></div>
    <div class="row"><span>Date/Time</span><span>${formattedDate}</span></div>
    <div class="row"><span>Amount withdrawn</span><span>${amountWithdrawnVal} USD</span></div>
    <div class="row"><span>Fee</span><span>${feeVal} USD</span></div>
    <div class="row"><span>Exchange rate</span><span>${rateVal}</span></div>
    <div class="row"><span>Amount sent</span><span>${amountSentVal}</span></div>
    <div class="row"><span>Beneficiary bank</span><span>${bankVal}</span></div>
    <div class="row"><span>Beneficiary name</span><span>${nameVal}</span></div>
    <div class="row"><span>Account number</span><span>${accountVal}</span></div>
    `;

    document.getElementById("table").innerHTML = html;
}
</script>

</body>
</html>
